# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> pick this repository.
#
# The database is NOT hosted on Render: Render's free Postgres expires after
# 30 days. Use a permanently free Postgres such as Neon (https://neon.tech)
# and paste its connection string into DATABASE_URL on the backend service.
# After the first deploy, set BUN_PUBLIC_BACKEND_URL on the frontend to the
# backend service's public URL (https://<backend-name>.onrender.com).
services:
  - type: web
    name: ai-interviewer-backend
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_KEY
        sync: false
      - key: PORT
        value: 3001

  - type: web
    name: ai-interviewer-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: BUN_PUBLIC_BACKEND_URL
        sync: false
      - key: PORT
        value: 3000
